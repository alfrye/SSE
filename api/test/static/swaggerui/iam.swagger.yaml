swagger: "2.0"
info:
  title: pb/users.proto
  version: version not set
tags:
  - name: UserSvc
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/stream:
    get:
      summary: Stream Date
      description: Stream Data
      operationId: UserSvc_StreamData
      responses:
        "200":
          description: Sucessfully stream data
          schema:
            $ref: '#/definitions/apiv1MyStreamingResponse'
      parameters:
        - name: inputData
          in: query
          required: false
          type: string
      tags:
        - UserSvc
  /v1/users:
    get:
      summary: Get Users
      description: Get users
      operationId: UserSvc_GetUsers
      responses:
        "200":
          description: Sucessfully creates user
          schema:
            $ref: '#/definitions/apiv1CreateUserResponse'
      parameters:
        - name: userId
          in: query
          required: false
          type: string
      tags:
        - UserSvc
    post:
      summary: Create User
      description: Creates a new uaer
      operationId: UserSvc_CreateUser
      responses:
        "200":
          description: Sucessfully creates user
          schema:
            $ref: '#/definitions/apiv1CreateUserResponse'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/apiv1CreateUserRequest'
      tags:
        - UserSvc
definitions:
  apiv1CreateUserRequest:
    type: object
    properties:
      id:
        type: integer
        format: int32
      username:
        type: string
  apiv1CreateUserResponse:
    type: object
    properties:
      success:
        type: boolean
  apiv1GetUsersResponse:
    type: object
    properties:
      message:
        type: string
  apiv1MyStreamingResponse:
    type: object
    properties:
      chunkData:
        type: string
